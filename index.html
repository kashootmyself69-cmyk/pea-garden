<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e8eee6;--fg:#1b2a26;--card:#f6f9f3;--mut:#5d6f67;--acc:#2f5d8a;--bd:#c5d2c5}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141d1c;--fg:#e3ece6;--card:#1c2827;--mut:#93a89e;--acc:#8fb7ea;--bd:#2c3d3a}}
:root[data-theme="dark"]{--bg:#141d1c;--fg:#e3ece6;--card:#1c2827;--mut:#93a89e;--acc:#8fb7ea;--bd:#2c3d3a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:780px;margin:0 auto;padding:18px 16px 40px}
h1{font:800 clamp(28px,6vw,40px)/1.05 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 14px;max-width:60ch}
canvas{display:block;width:100%;border-radius:14px;touch-action:manipulation;cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-top:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
button,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer}
button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--acc)}
.lab{display:flex;justify-content:space-between;font-weight:600;margin-bottom:2px}.lab span{color:var(--mut);font-weight:400}
.g{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}@media(max-width:560px){.g{grid-template-columns:1fr}}
</style></head><body><div class="w">
<h1>Pea plant garden</h1>
<p class="sub">Tap the soil to throw a pea. Your plants live through 75 days of real sensor readings, and every hour becomes a note. Drag time to scrub, or bend the weather with the sliders.</p>
<canvas id="c"></canvas>
<div class="card"><div class="row"><button id="rev" title="Play backward">◀ Rewind</button><button id="pause">⏸ Pause</button><button id="fwd">Grow ▶</button>
<select id="spd" aria-label="Speed"><option value=".5">Slow</option><option value="1" selected>Normal</option><option value="2">Fast</option><option value="4">Very fast</option></select>
<button id="thr">Throw peas</button><button id="clr">Dig up</button></div>
<div class="lab">Growth time <span id="tl"></span></div><input type="range" id="time" min="0" max="1799" value="0" aria-label="Growth time"></div>
<div class="card"><div class="row" style="margin:0 0 10px;justify-content:space-between"><b>Weather</b><button id="rst">Reset to recorded</button></div><div class="g" id="sl"></div></div>
